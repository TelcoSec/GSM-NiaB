name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        working-directory: ./dashboard
        run: npm ci --legacy-peer-deps

      - name: Run Linter
        working-directory: ./dashboard
        run: npm run lint

      - name: Generate Static SPA
        working-directory: ./dashboard
        run: npm run generate

      - name: Verify Build Output
        run: |
          echo "Listing build output:"
          ls -la ./dashboard/.output/public || echo "ERROR: .output/public not found!"
          echo "File count: $(find ./dashboard/.output/public -type f | wc -l)"

      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@latest pages deploy ./dashboard/.output/public --project-name=gsm-dashboard --commit-dirty=true
